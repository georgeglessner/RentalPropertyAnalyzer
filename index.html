<!DOCTYPE html>
<html>
    <head>
        <link
            href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/@mdi/font@4.x/css/materialdesignicons.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css"
            rel="stylesheet"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
        />
        <title>Rent Analyzer</title>
        <style>
            body {
                background: #f5f5f5;
            }
            .v-card {
                border-radius: 16px;
            }
            .v-toolbar-title {
                font-weight: 500;
                font-size: 1.3rem;
            }
            .v-card-actions {
                justify-content: flex-end;
            }
            .v-simple-table td {
                font-size: 1rem;
                padding: 8px 12px;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <v-app>
                <v-main>
                    <v-container class="fill-height" fluid>
                        <v-row align="center" justify="center">
                            <v-col cols="12" sm="8" md="4">
                                <v-card class="elevation-12" elevation="24">
                                    <v-toolbar color="primary" dark flat>
                                        <v-toolbar-title
                                            >Rental Property
                                            Analyzer</v-toolbar-title
                                        >
                                        <v-spacer></v-spacer>
                                    </v-toolbar>
                                    <v-card-text>
                                        <v-form ref="form">
                                            <v-text-field
                                                label="Purchase Price"
                                                v-model="purchasePrice"
                                                id="purchasePrice"
                                                prepend-icon="mdi-currency-usd"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                label="Rent Price"
                                                v-model="rentPrice"
                                                prepend-icon="mdi-cash"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-checkbox
                                                v-model="financed"
                                                :label="`Financed`"
                                            >
                                            </v-checkbox>

                                            <v-text-field
                                                v-if="financed"
                                                label="Finance Amount"
                                                v-model="financedAmount"
                                                prepend-icon="mdi-bank"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                v-if="financed"
                                                label="Monthly Mortgage Payment"
                                                v-model="mortgageAmount"
                                                prepend-icon="mdi-currency-usd-off"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                label="Rehab Cost"
                                                v-model="rehabCost"
                                                prepend-icon="mdi-bulldozer"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                label="Yearly Property Tax / Insurance"
                                                v-model="taxInsurance"
                                                prepend-icon="mdi-shield-home"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                label="Monthly Utilities"
                                                v-model="utilities"
                                                prepend-icon="mdi-lightbulb"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>

                                            <v-text-field
                                                label="Monthly Management"
                                                v-model="management"
                                                prepend-icon="mdi-account-group"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            ></v-text-field>

                                            <v-text-field
                                                label="Monthly Repairs"
                                                v-model="repairs"
                                                prepend-icon="mdi-hammer-wrench"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            ></v-text-field>

                                            <v-text-field
                                                label="Monthly CapEx"
                                                v-model="capex"
                                                prepend-icon="mdi-hammer-wrench"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            ></v-text-field>

                                            <v-text-field
                                                label="Monthly Vacancy Allowance"
                                                v-model="vacancy"
                                                prepend-icon="mdi-cancel"
                                                type="number"
                                                @focus="$event.target.select()"
                                                prefix="$"
                                            >
                                            </v-text-field>
                                        </v-form>
                                    </v-card-text>
                                    <v-card-actions class="justify-center">
                                        <v-btn color="primary" @click="submit">Submit</v-btn>
                                        <v-btn color="primary" @click="reset">Reset</v-btn>
                                        <v-btn color="secondary" @click="share" title="Copy shareable link">
                                            <v-icon left>mdi-share-variant</v-icon>Share
                                        </v-btn>
                                    </v-card-actions>
                                    <v-simple-table v-if="submitted">
                                        <template v-slot:default>
                                            <tbody>
                                                <tr>
                                                    <td>Monthly Cash Flow</td>
                                                    <td>${{cashFlow}}</td>
                                                </tr>
                                                <tr>
                                                    <td>Monthly Costs</td>
                                                    <td>${{monthlyCosts}}</td>
                                                </tr>
                                                <tr>
                                                    <td>Cash on Cash ROI</td>
                                                    <td>{{roi}}%</td>
                                                </tr>
                                            </tbody>
                                        </template>
                                    </v-simple-table>
                                </v-card>
                            </v-col>
                        </v-row>
                    </v-container>
                </v-main>
            </v-app>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
        <script>
            // Helper: parse query params
            function getParams() {
                const params = {};
                window.location.search.replace(/\??([^=&]+)=([^&]*)/g, (_, k, v) => {
                    params[k] = decodeURIComponent(v);
                });
                return params;
            }

            // Helper: update URL params
            function setParams(data) {
                const keys = [
                    "purchasePrice", "rentPrice", "financed", "financedAmount", "mortgageAmount",
                    "rehabCost", "taxInsurance", "utilities", "management", "repairs", "capex", "vacancy"
                ];
                const params = keys.map(k => `${k}=${encodeURIComponent(data[k])}`).join("&");
                window.history.replaceState({}, '', `?${params}`);
            }

            let v = new Vue({
                el: "#app",
                vuetify: new Vuetify(),
                data: {
                    purchasePrice: 0,
                    rentPrice: 0,
                    financed: false,
                    financedAmount: 0,
                    mortgageAmount: 0,
                    rehabCost: 0,
                    taxInsurance: 0,
                    utilities: 0,
                    management: 0,
                    repairs: 0,
                    capex: 0,
                    vacancy: 0,
                    submitted: false,
                    cashFlow: 0,
                    monthlyCosts: 0,
                    roi: 0,
                },
                created() {
                    // Load from URL params
                    const params = getParams();
                    let hasParams = false;
                    Object.keys(this.$data).forEach(key => {
                        if (params[key] !== undefined) {
                            hasParams = true;
                            if (typeof this[key] === "boolean") {
                                this[key] = params[key] === "true";
                            } else {
                                this[key] = isNaN(params[key]) ? params[key] : Number(params[key]);
                            }
                        }
                    });
                    // If there are params, auto-submit
                    if (hasParams) {
                        this.submit();
                    }
                },
                watch: {
                    // Watch all relevant fields and update URL
                    purchasePrice: 'updateUrl',
                    rentPrice: 'updateUrl',
                    financed: 'updateUrl',
                    financedAmount: 'updateUrl',
                    mortgageAmount: 'updateUrl',
                    rehabCost: 'updateUrl',
                    taxInsurance: 'updateUrl',
                    utilities: 'updateUrl',
                    management: 'updateUrl',
                    repairs: 'updateUrl',
                    capex: 'updateUrl',
                    vacancy: 'updateUrl',
                },
                methods: {
                    updateUrl() {
                        setParams(this.$data);
                    },
                    submit() {
                        Object.keys(this.$data).forEach((key) => {
                            if (this[`${key}`] === "" || this[`${key}`] === null) {
                                this[`${key}`] = 0;
                            }
                        });
                        if (!this.financed) {
                            this.financedAmount = 0;
                            this.mortgageAmount = 0;
                        }
                        const moneyIn = this.financed
                            ? parseFloat(this.purchasePrice) -
                              parseFloat(this.financedAmount) +
                              parseFloat(this.rehabCost)
                            : parseFloat(this.purchasePrice) +
                              parseFloat(this.rehabCost);
                        this.monthlyCosts =
                            parseFloat(this.mortgageAmount) +
                            Math.round(parseFloat(this.taxInsurance) / 12) +
                            parseFloat(this.utilities) +
                            parseFloat(this.management) +
                            parseFloat(this.repairs) +
                            parseFloat(this.capex) +
                            parseFloat(this.vacancy);

                        this.cashFlow =
                            parseFloat(this.rentPrice) -
                            parseFloat(this.monthlyCosts);
                        let cashRoi =
                            (parseFloat(this.cashFlow) * 12) /
                            parseFloat(moneyIn);

                        this.roi = isFinite(cashRoi) ? Math.round(cashRoi * 100) : 0;

                        this.submitted = true;
                        setParams(this.$data);
                    },
                    reset() {
                        Object.keys(this.$data).forEach((key) => {
                            if (typeof this[key] === "boolean") {
                                this[key] = false;
                            } else {
                                this[key] = 0;
                            }
                        });
                        this.submitted = false;
                        setParams(this.$data);
                    },
                    share() {
                        // Copy current URL to clipboard
                        const url = window.location.href;
                        if (navigator.clipboard) {
                            navigator.clipboard.writeText(url).then(() => {
                                this.$vuetify.toast && this.$vuetify.toast.success('Link copied!');
                            });
                        } else {
                            // fallback for older browsers
                            const temp = document.createElement('input');
                            temp.value = url;
                            document.body.appendChild(temp);
                            temp.select();
                            document.execCommand('copy');
                            document.body.removeChild(temp);
                        }
                        alert('Shareable link copied to clipboard!');
                    },
                },
            });
        </script>
    </body>
</html>
